name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install (editable, dev extras)
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests

      # The suite is deliberately offline: no test may hit the live web or need the scraper binary.
      - name: Test
        run: python -m pytest -q

      - name: CLI smoke (digest contract)
        shell: bash
        run: |
          python -m leadforge --json version | grep -c "^LF_DIGEST " | grep -qx "1"
          python -m leadforge --json status | grep -c "^LF_DIGEST " | grep -qx "1"

      - name: Non-editable install works
        shell: bash
        run: |
          python -m pip uninstall -y leadforge
          python -m pip install .
          python -m leadforge version
          # the packaged rubric must ship in the wheel — score once crashed here (repo-relative path)
          python -c "from importlib.resources import files; t=(files('leadforge')/'data'/'scoring.default.yaml').read_text(encoding='utf-8'); assert 'factors' in t"

  versions:
    name: Version strings agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: pyproject == __init__ == plugin manifests == skill frontmatter (== pushed tag)
        run: |
          python - <<'EOF'
          import json, os, re, sys, tomllib
          py = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          init = re.search(r'__version__ = "([^"]+)"', open("src/leadforge/__init__.py").read()).group(1)
          claude = json.load(open(".claude-plugin/plugin.json"))["version"]
          codex = json.load(open(".codex-plugin/plugin.json"))["version"]
          skill = re.search(r'version: "([^"]+)"', open("skills/generate-leads/SKILL.md").read()).group(1)
          versions = {"pyproject": py, "__init__": init, "claude-plugin": claude, "codex-plugin": codex, "skill": skill}
          # a release tag is the external anchor: vX.Y.Z must equal the five strings,
          # otherwise five stale-but-agreeing strings sail through (happened at v0.1.2/v0.1.3)
          ref = os.environ.get("GITHUB_REF", "")
          if ref.startswith("refs/tags/v"):
              versions["tag"] = ref.removeprefix("refs/tags/v")
          print(versions)
          sys.exit(0 if len(set(versions.values())) == 1 else 1)
          EOF

  plugin-validate:
    name: claude plugin validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin + marketplace manifests
        run: claude plugin validate .

  manifests:
    name: Validate plugin manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JSON is well-formed
        run: |
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json \
                   .codex-plugin/plugin.json .agents/plugins/marketplace.json; do
            echo "checking $f"
            python -c "import json,sys; json.load(open('$f'))"
          done
      - name: Skill frontmatter is portable (spec fields only)
        run: python .github/scripts/check_skill_frontmatter.py
